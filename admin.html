<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b1330">
<meta name="robots" content="noindex,nofollow">
<title>JayLu Nation – Admin</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect width=%2764%27 height=%2764%27 rx=%2714%27 fill=%27%23ff5d8f%27/%3E%3Ctext x=%2732%27 y=%2745%27 font-size=%2734%27 font-weight=%27800%27 text-anchor=%27middle%27 fill=%27%231b1330%27 font-family=%27Arial,sans-serif%27%3EJL%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
  --dusk:#1b1330;--panel:#241a3f;--raise:#2f2352;--line:#3d2f66;
  --paper:#f7f0ea;--muted:#b6a9cc;--pink:#ff5d8f;--pink-deep:#e8467b;
  --display:"Big Shoulders Display","Oswald","Arial Narrow",Impact,sans-serif;
  --text:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r-s:6px;--r-m:10px;--r-l:14px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:76px}
body{margin:0;min-height:100vh;background:var(--dusk);color:var(--paper);font:16px/1.55 var(--text);-webkit-font-smoothing:antialiased;padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
h1,h2,p,dl,dd{margin:0}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button:disabled{cursor:default}
a{color:inherit}
:focus-visible{outline:2px solid var(--pink);outline-offset:2px}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.sprite{position:absolute;width:0;height:0;overflow:hidden}
.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}

/* top bar */
.top{position:sticky;top:0;z-index:20;background:var(--dusk);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.top-in{max-width:880px;margin:0 auto;padding:10px 20px;min-height:60px;display:flex;align-items:center;gap:8px}
.logo{font:900 32px/1 var(--display);letter-spacing:.01em;text-decoration:none}
.section-name{margin-right:auto;padding-left:12px;border-left:1px solid var(--line);color:var(--muted);font-size:14px;font-weight:600}
.ibtn{width:40px;height:40px;flex:none;display:inline-grid;place-items:center;border-radius:var(--r-m);color:var(--muted);transition:background-color .12s,color .12s}
.ibtn:hover{background:var(--raise);color:var(--paper)}

/* controls */
.btn{min-height:42px;padding:0 18px;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);border-radius:var(--r-m);font-size:15px;font-weight:600;transition:background-color .12s,border-color .12s}
.btn:hover{background:var(--raise)}
.btn.pri{background:var(--pink);border-color:var(--pink);color:var(--dusk)}
.btn.pri:hover{background:var(--pink-deep);border-color:var(--pink-deep)}
.btn:disabled{opacity:.5}
.btn.sm{min-height:36px;padding:0 14px;font-size:14px}
.field{display:block;width:100%;padding:11px 14px;background:var(--dusk);border:1px solid var(--line);border-radius:var(--r-m);color:var(--paper);font:inherit;font-size:16px;line-height:1.45;resize:vertical}
.field::placeholder{color:var(--muted);opacity:.85}
.field:focus{border-color:var(--pink)}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:12px}
.row .push{margin-left:auto}

/* page */
.page{max-width:880px;margin:0 auto;padding:28px 20px 64px;display:grid;gap:20px}
#dash{display:grid;gap:20px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-l)}
.t{font:800 22px/1.15 var(--display);margin-bottom:4px}
.hint{color:var(--muted);font-size:14px}
.note{padding:10px 12px;border-left:3px solid var(--pink);border-radius:0 var(--r-s) var(--r-s) 0;background:var(--panel);font-size:14px}
.login{width:100%;max-width:420px;margin:40px auto;padding:24px}
.login .t{font-size:30px;margin-bottom:16px}
.login .field+.field{margin-top:10px}

.stats{display:flex;flex-wrap:wrap;gap:8px 44px}
.stats dt{color:var(--muted);font-size:14px}
.stats dd{font:900 56px/1 var(--display);font-variant-numeric:tabular-nums}

.ed{padding:18px 20px}
.ed .hint{margin-bottom:12px}
.ed input.field{margin-bottom:10px}
.list-in{margin-top:14px}
.item{display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.item .body{flex:1;min-width:0;overflow-wrap:anywhere;white-space:pre-line}
.item small{display:block;margin-top:2px;color:var(--muted);font-size:13px}
.item .ver{margin-right:6px;color:var(--pink);font:800 20px/1 var(--display)}
.item .ibtn{margin:-6px -8px -6px 0}

.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tab{min-height:42px;padding:0 16px;display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:var(--r-s);color:var(--muted);font:700 20px/1 var(--display);transition:background-color .12s,color .12s}
.tab:hover{background:var(--panel);color:var(--paper)}
.tab.on{background:var(--paper);border-color:var(--paper);color:var(--dusk)}
.tab.push{margin-left:auto}

.feed{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-l);overflow:hidden}
.feed>*+*{border-top:1px solid var(--line)}
.state{padding:28px 20px;text-align:center;color:var(--muted)}
.post{padding:18px 20px}
.hd{display:flex;align-items:center;gap:12px}
.hd .meta{flex:1;min-width:0}
.hd b{display:block;font-weight:600;line-height:1.25;overflow-wrap:anywhere}
.hd time{display:block;color:var(--muted);font-size:13px}
.cat{color:var(--muted);font-size:13px}
.av{width:40px;height:40px;flex:none;display:grid;place-items:center;border-radius:50%;background:var(--raise);font:800 18px/1 var(--display)}
.txt{margin:12px 0 0;white-space:pre-wrap;word-break:break-word}
.media{display:block;width:100%;max-height:200px;margin-top:12px;object-fit:contain;background:var(--dusk);border-radius:var(--r-m)}

@media(max-width:700px){
  .top-in,.page{padding-left:16px;padding-right:16px}
  .logo{font-size:28px}
  .stats dd{font-size:46px}
  .ed,.post{padding-left:16px;padding-right:16px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<svg class="sprite" aria-hidden="true" focusable="false">
  <defs>
    <symbol id="i-trash" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></symbol>
    <symbol id="i-sound" viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></symbol>
    <symbol id="i-mute" viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></symbol>
  </defs>
</svg>

<header class="top">
  <div class="top-in">
    <a class="logo" href="./">JayLu Nation</a>
    <span class="section-name">Admin</span>
    <button class="ibtn" id="snd" type="button" aria-label="Sound effects" aria-pressed="true"></button>
    <button class="btn sm" id="out" type="button" hidden>Sign out</button>
  </div>
</header>

<main class="page">
  <h1 class="sr">Admin</h1>
  <div id="note" class="note" role="status" hidden></div>

  <section class="panel login" id="login">
    <h2 class="t">Admin sign in</h2>
    <input class="field" type="text" id="em" placeholder="Username" aria-label="Username" autocomplete="username">
    <input class="field" type="password" id="pw" placeholder="Password" aria-label="Password" autocomplete="current-password">
    <div class="row"><button class="btn pri push" id="in" type="button">Sign in</button></div>
  </section>

  <div id="dash" hidden>
    <dl class="stats">
      <div><dt>Posts</dt><dd id="a1">0</dd></div>
      <div><dt>Comments</dt><dd id="a2">0</dd></div>
      <div><dt>Likes</dt><dd id="a3">0</dd></div>
    </dl>

    <section class="panel ed">
      <h2 class="t">Announcements</h2>
      <p class="hint">Shown as a pop-up when someone opens the site. The newest one is featured.</p>
      <textarea class="field" id="annin" rows="2" maxlength="300" aria-label="Announcement text" placeholder="Write an announcement, e.g. “Trailer 3 drops Friday!”"></textarea>
      <div class="row"><button class="btn pri push" id="annsave" type="button">Post announcement</button></div>
      <div class="list-in" id="annlist"></div>
    </section>

    <section class="panel ed">
      <h2 class="t">Changelog</h2>
      <p class="hint">Shown in the “What’s new” pop-up on the site.</p>
      <input class="field" type="text" id="clv" maxlength="30" aria-label="Version or title" placeholder="Version or title, e.g. v1.2">
      <textarea class="field" id="clin" rows="3" maxlength="800" aria-label="Changes" placeholder="What changed? One line per change."></textarea>
      <div class="row"><button class="btn pri push" id="clsave" type="button">Post changelog</button></div>
      <div class="list-in" id="cllist"></div>
    </section>

    <div class="tabs">
      <button class="tab on" type="button" data-t="posts">Posts</button>
      <button class="tab" type="button" data-t="comments">Comments</button>
      <button class="tab push" type="button" id="rf"><svg class="i" aria-hidden="true"><use href="#i-refresh"/></svg>Refresh</button>
    </div>
    <div class="feed" id="list"></div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const SB_URL='https://dvvnvefgacwnzohucpyv.supabase.co';
const SB_KEY='sb_publishable_r7r6IKE2uMinM7iA1mr42Q_kFDZAqae';
const sb=window.supabase.createClient(SB_URL,SB_KEY);
const $=id=>document.getElementById(id);
const ic=n=>'<svg class="i" aria-hidden="true"><use href="#i-'+n+'"/></svg>';
let muted=false;try{muted=localStorage.getItem('jl_mute')==='1'}catch(e){}
let AC=null;
function tone(f,t0,d,type,g,f2){const t=AC.currentTime+t0,o=AC.createOscillator(),v=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);v.gain.setValueAtTime(.0001,t);v.gain.exponentialRampToValueAtTime(g,t+.01);v.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(v);v.connect(AC.destination);o.start(t);o.stop(t+d+.03)}
function sfx(n){
 if(muted||!n)return;
 try{
  AC=AC||new(window.AudioContext||window.webkitAudioContext)();
  if(AC.state==='suspended')AC.resume();
  if(n==='click')tone(480,0,.09,'triangle',.12,760);
  else if(n==='tick')tone(900,0,.05,'sine',.08);
  else if(n==='like'){tone(660,0,.09,'sine',.14);tone(990,.07,.14,'sine',.14)}
  else if(n==='success')[523,659,784,1047].forEach((f,i)=>tone(f,i*.08,.16,'triangle',.12));
  else if(n==='error')tone(200,0,.22,'sawtooth',.08,120);
 }catch(e){}
}
document.addEventListener('click',e=>{
 const b=e.target.closest('button,.btn,.tab,.act');if(!b||b.disabled||b.id==='snd')return;
 sfx(b.matches('.tab,[data-t]')?'tick':'click');
},true);
function setSnd(){const b=$('snd');b.innerHTML=ic(muted?'mute':'sound');b.setAttribute('aria-pressed',muted?'false':'true');b.title=muted?'Sound effects are off':'Sound effects are on'}
setSnd();
$('snd').onclick=()=>{muted=!muted;try{localStorage.setItem('jl_mute',muted?'1':'0')}catch(e){}setSnd();sfx('click')};

const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let tab='posts',posts=[],cmts=[],nLikes=0;
function note(m){const n=$('note');n.textContent=m;n.hidden=!m;if(m)sfx(/couldn’t|failed|not allowed|too big/i.test(m)?'error':/posted|published|removed|cleared|saved/i.test(m)?'success':'')}
function show(on){$('login').hidden=on;$('dash').hidden=!on;$('out').hidden=!on;if(on)load()}
async function load(){
 const [p,c,l]=await Promise.all([
  sb.from('posts').select('*').order('created_at',{ascending:false}).limit(300),
  sb.from('comments').select('*').order('created_at',{ascending:false}).limit(500),
  sb.from('likes').select('id',{count:'exact',head:true})]);
 if(p.error){note('Couldn’t load: '+p.error.message);return}
 posts=p.data||[];cmts=c.data||[];nLikes=l.count||0;render();
 sb.from('settings').select('value').eq('key','announcement').maybeSingle().then(r=>{anns=parseAnn((r.data&&r.data.value)||'');renderAnn()});
 sb.from('settings').select('value').eq('key','changelog').maybeSingle().then(r=>{logs=parseAnn((r.data&&r.data.value)||'');renderLog()});
}
const avatar=n=>'<div class="av">'+esc((n||'F')[0]).toUpperCase()+'</div>';
function render(){
 $('a1').textContent=posts.length;$('a2').textContent=cmts.length;$('a3').textContent=nLikes;
 document.querySelectorAll('[data-t]').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
 const when=t=>new Date(t).toLocaleString();
 if(tab==='posts'){
  $('list').innerHTML=posts.length?posts.map(p=>{
   const med=p.media?(p.mt==='video'?`<video class="media" src="${esc(p.media)}" controls></video>`:`<img class="media" src="${esc(p.media)}" alt="">`):'';
   return `<article class="post"><div class="hd">${avatar(p.name)}<div class="meta"><b>${esc(p.name)}</b><time>${when(p.created_at)}</time></div><span class="cat">${esc(p.cat)}</span></div>${p.text?`<div class="txt">${esc(p.text)}</div>`:''}${med}<div class="row"><button class="btn sm push" type="button" data-dp="${esc(p.id)}">${ic('trash')}Delete post</button></div></article>`}).join(''):'<div class="state">No posts.</div>';
 }else{
  $('list').innerHTML=cmts.length?cmts.map(c=>`<article class="post"><div class="hd">${avatar(c.name)}<div class="meta"><b>${esc(c.name)}</b><time>${when(c.created_at)}</time></div><button class="ibtn" type="button" data-dc="${esc(c.id)}" title="Delete comment" aria-label="Delete comment">${ic('trash')}</button></div><div class="txt">${esc(c.body)}</div></article>`).join(''):'<div class="state">No comments.</div>';
 }
}
document.addEventListener('click',async e=>{
 const t=e.target.closest('[data-t],[data-dp],[data-dc],#rf');if(!t)return;
 if(t.dataset.t){tab=t.dataset.t;render();return}
 if(t.id==='rf'){load();return}
 try{
  if(t.dataset.dp){
   if(!confirm('Delete this post, its comments, likes and file?'))return;
   const p=posts.find(x=>x.id===t.dataset.dp);
   const r=await sb.from('posts').delete().eq('id',p.id).select();
   if(r.error)throw r.error;
   if(!r.data.length)throw new Error('Not allowed — check the admin SQL policies and that you signed in with the admin email.');
   const m=(p.media||'').split('/object/public/uploads/')[1];
   if(m)await sb.storage.from('uploads').remove([decodeURIComponent(m)]);
  }else if(t.dataset.dc){
   if(!confirm('Delete this comment?'))return;
   const r=await sb.from('comments').delete().eq('id',t.dataset.dc).select();
   if(r.error)throw r.error;
   if(!r.data.length)throw new Error('Not allowed — check the admin SQL policies and that you signed in with the admin email.');
  }
  note('');sfx('success');await load();
 }catch(err){note('Delete failed: '+(err&&err.message||'unknown error'))}
});
$('in').onclick=async()=>{
 const r=await sb.auth.signInWithPassword({email:(v=>v.includes('@')?v:v.toLowerCase()+'@jaylunation.com')($('em').value.trim()),password:$('pw').value});
 if(r.error){note('Sign in failed: '+r.error.message);return}
 $('pw').value='';note('');show(true);
};
let anns=[];
function parseAnn(v){try{const x=JSON.parse(v);if(Array.isArray(x))return x}catch(e){}return v?[{t:v,ts:0}]:[]}
function renderAnn(){
 $('annlist').innerHTML=anns.length?anns.map((x,i)=>`<div class="item"><div class="body">${esc(x.t)}${x.ts?`<small>${new Date(x.ts).toLocaleString()}</small>`:''}</div><button class="ibtn" type="button" data-da="${i}" title="Delete announcement" aria-label="Delete announcement">${ic('trash')}</button></div>`).join(''):'<p class="hint">No announcements yet.</p>';
}
async function saveAnns(msg){
 try{
  const r=await sb.from('settings').upsert({key:'announcement',value:JSON.stringify(anns)}).select();
  if(r.error)throw r.error;
  if(!r.data.length)throw new Error('Not allowed — run the settings SQL and sign in with the admin account.');
  note(msg);renderAnn();
 }catch(err){note('Couldn’t save: '+(err&&err.message||'unknown error'))}
}
$('annsave').onclick=()=>{const t=$('annin').value.trim();if(!t)return;anns.unshift({t,ts:Date.now()});anns=anns.slice(0,20);$('annin').value='';saveAnns('Announcement posted.')};
$('annlist').addEventListener('click',e=>{const b=e.target.closest('[data-da]');if(!b)return;anns.splice(+b.dataset.da,1);saveAnns('Announcement removed.')});
let logs=[];
function renderLog(){
 $('cllist').innerHTML=logs.length?logs.map((x,i)=>`<div class="item"><div class="body">${x.v?`<span class="ver">${esc(x.v)}</span>`:''}${esc(x.t)}${x.ts?`<small>${new Date(x.ts).toLocaleString()}</small>`:''}</div><button class="ibtn" type="button" data-dl="${i}" title="Delete entry" aria-label="Delete changelog entry">${ic('trash')}</button></div>`).join(''):'<p class="hint">No changelog entries yet.</p>';
}
async function saveLogs(msg){
 try{
  const r=await sb.from('settings').upsert({key:'changelog',value:JSON.stringify(logs)}).select();
  if(r.error)throw r.error;
  if(!r.data.length)throw new Error('Not allowed — run the settings SQL and sign in with the admin account.');
  note(msg);renderLog();
 }catch(err){note('Couldn’t save: '+(err&&err.message||'unknown error'))}
}
$('clsave').onclick=()=>{const t=$('clin').value.trim();if(!t)return;logs.unshift({v:$('clv').value.trim(),t,ts:Date.now()});logs=logs.slice(0,30);$('clin').value='';$('clv').value='';saveLogs('Changelog posted.')};
$('cllist').addEventListener('click',e=>{const b=e.target.closest('[data-dl]');if(!b)return;logs.splice(+b.dataset.dl,1);saveLogs('Changelog entry removed.')});
$('pw').addEventListener('keydown',e=>{if(e.key==='Enter')$('in').click()});
$('out').onclick=async()=>{await sb.auth.signOut();posts=[];cmts=[];show(false)};
const isAdm=s=>!!(s&&s.user&&s.user.email==='admin@jaylunation.com');
sb.auth.getSession().then(({data})=>show(isAdm(data.session)));
</script>
</body>
</html>
