<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="theme-color" content="#08040f">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JayLu Nation – Admin</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%8C%B4%3C/text%3E%3C/svg%3E">
<style>
:root{--a:#8b5cf6;--b:#c026d3;--c:#6d28d9;--d:#a78bfa;--txt:#f1ebfb;--sub:#a597c0;--g1:rgba(139,92,246,.10);--g2:rgba(139,92,246,.04);--edge:#2a1b45;--sh:rgba(0,0,0,.5);--card:#100919;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;font:15px/1.5 Inter,-apple-system,"SF Pro Display","Segoe UI",Roboto,system-ui,sans-serif;color:var(--txt);background:radial-gradient(900px 480px at 50% -8%,rgba(124,58,237,.20),transparent 70%),radial-gradient(900px 420px at 50% 112%,rgba(139,92,246,.22),transparent 70%),#08040f fixed}
body::before{content:none}
.orb{display:none;position:fixed;border-radius:50%;filter:blur(60px);z-index:-1;opacity:.7;animation:fl 14s ease-in-out infinite alternate}
.o1{width:340px;height:340px;background:var(--d);top:8%;left:-80px}.o2{width:380px;height:380px;background:var(--a);bottom:5%;right:-100px;animation-delay:-6s}
@keyframes fl{to{transform:translate(40px,-50px) scale(1.15)}}
.palms{position:fixed;left:0;right:0;bottom:0;width:100%;height:75vh;z-index:-1;pointer-events:none}
.glass{position:relative;background:var(--card);border:1px solid var(--edge);border-radius:18px;box-shadow:inset 0 1px 0 rgba(255,255,255,.03),0 8px 30px rgba(0,0,0,.45);transition:border-color .25s,box-shadow .25s}
.glass:hover{border-color:rgba(139,92,246,.75);box-shadow:0 0 0 1px rgba(139,92,246,.3),0 0 34px rgba(139,92,246,.4),0 8px 30px rgba(0,0,0,.5)}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;margin:10px auto 0;max-width:1100px;width:calc(100% - 20px);display:flex;align-items:center;gap:12px;padding:10px 18px;border-radius:16px}
.logo{font-weight:900;font-size:22px;letter-spacing:-.5px;background:linear-gradient(90deg,#fff,#e9d5ff,#c4b5fd);-webkit-background-clip:text;background-clip:text;color:transparent}
.logo b{font-weight:900;color:#c4b5fd;-webkit-text-fill-color:#c4b5fd}
nav .sp{flex:1}.pill{font-size:12px;font-weight:700;padding:5px 12px;border-radius:999px;background:rgba(139,92,246,0.16);border:1px solid var(--edge)}
.wrap{max-width:1100px;margin:16px auto 60px;padding:0 10px;display:grid;grid-template-columns:260px minmax(0,1fr) 250px;gap:16px}
@media(max-width:900px){.wrap{grid-template-columns:1fr}.side{display:none}}
.card{padding:18px}.side{position:sticky;top:84px;align-self:start;display:grid;gap:16px}
h1,h2,h3{margin:0}h3{font-size:14px;text-transform:uppercase;letter-spacing:.12em;color:var(--sub);margin-bottom:10px}
.hero{padding:26px 22px;overflow:hidden}.hero h1{font-size:clamp(30px,6vw,52px);line-height:1;font-weight:900;letter-spacing:-1.5px}
.hero h1 span{background:linear-gradient(90deg,#c4b5fd,#c084fc);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{margin:10px 0 0;color:var(--sub);max-width:520px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip,button,select{font:inherit;color:var(--txt);cursor:pointer}
.chip{padding:7px 14px;border-radius:10px;border:1px solid var(--edge);background:rgba(139,92,246,0.1);font-weight:600;font-size:13px;transition:.2s}
.chip:hover{background:rgba(139,92,246,0.26)}.chip.on{background:linear-gradient(135deg,var(--a),var(--b));border-color:transparent;box-shadow:0 4px 18px rgba(139,92,246,.5)}
textarea,input[type=text],select{width:100%;background:rgba(139,92,246,0.09);border:1px solid var(--edge);border-radius:16px;color:var(--txt);padding:12px 14px;font:inherit;outline:none;resize:vertical}
select option{color:#222}textarea::placeholder,input::placeholder{color:var(--sub)}
textarea:focus,input:focus{border-color:#fff;box-shadow:0 0 0 3px rgba(139,92,246,0.16)}
.row{display:flex;gap:10px;align-items:center;margin-top:10px;flex-wrap:wrap}.row .sp{flex:1}
.btn{padding:10px 18px;border-radius:12px;border:1px solid var(--edge);background:rgba(139,92,246,0.14);font-weight:700;transition:.2s}
.btn:hover{background:rgba(139,92,246,0.28)}.btn.pri{background:linear-gradient(135deg,var(--a),var(--b));border-color:transparent;box-shadow:0 6px 20px rgba(139,92,246,.5)}
.btn:disabled{opacity:.5;cursor:default}
#feed{display:grid;gap:16px;margin-top:16px}
.post{padding:16px}.hd{display:flex;gap:10px;align-items:center}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:800;background:linear-gradient(135deg,var(--d),var(--c));border:1px solid var(--edge);flex:none}
.hd small{color:var(--sub);display:block;font-size:12px}.hd .sp{flex:1}
.tag{font-size:11px;font-weight:700;padding:3px 10px;border-radius:999px;background:rgba(139,92,246,0.16)}
.txt{margin:12px 0;white-space:pre-wrap;word-break:break-word}
.media{display:block;width:100%;max-height:520px;object-fit:cover;border-radius:18px;border:1px solid var(--edge)}
.acts{display:flex;gap:8px;margin-top:12px;border-top:1px solid var(--edge);padding-top:10px}
.act{flex:1;background:transparent;border:0;padding:8px;border-radius:12px;font-weight:600}.act:hover{background:rgba(139,92,246,0.12)}.act.liked{color:#c4b5fd}
.cm{margin-top:10px;display:grid;gap:8px}.c{background:rgba(139,92,246,0.1);border-radius:14px;padding:8px 12px;font-size:14px}.c b{margin-right:6px}
.empty,.note{text-align:center;color:var(--sub);padding:24px}.note{padding:10px;font-size:13px;margin-bottom:12px;border-radius:14px;background:rgba(139,92,246,0.09)}
.stat{display:flex;justify-content:space-between;padding:6px 0}.stat b{font-size:20px}
.file{display:none}
.btn:hover,.arr:hover,.chip:hover,.tile:hover{border-color:#8b5cf6;box-shadow:0 0 20px rgba(139,92,246,.6)}
.act:hover{background:rgba(139,92,246,.16);box-shadow:0 0 18px rgba(139,92,246,.45)}
.media{transition:box-shadow .25s}.media:hover{box-shadow:0 0 30px rgba(139,92,246,.55)}
.btn.pri:hover,.chip.on:hover,.tile.on:hover{box-shadow:0 0 32px rgba(139,92,246,.85)}
.av{transition:box-shadow .25s}.av:hover{box-shadow:0 0 16px rgba(139,92,246,.8)}
</style></head>
<body>
<svg class="palms" id="city" preserveAspectRatio="xMinYMax meet" aria-hidden="true"><defs><symbol id="p" viewBox="-20 0 260 400" overflow="visible"><path d="M104 400 Q92 260 112 122 L120 122 Q104 262 118 400Z"/><g id="lf"><path d="M114 122 Q72 52 4 88 Q70 76 114 122Z"/><path d="M114 122 Q86 44 28 38 Q82 62 114 122Z"/><path d="M114 122 Q60 112 14 152 Q72 124 114 122Z"/></g><g transform="translate(228 0) scale(-1 1)"><use href="#lf"/></g><path d="M114 122 Q112 50 118 22 Q124 52 114 122Z"/></symbol></defs><g id="pl"></g></svg>
<nav class="glass"><span class="logo">JayLu <b>Nation</b></span><span class="pill">🔒 Admin</span><span class="sp"></span><button class="btn" id="out" hidden>Sign out</button></nav>
<div style="max-width:820px;margin:16px auto 60px;padding:0 10px;display:grid;gap:16px">
 <div id="note" class="note" hidden></div>
 <section class="glass card" id="login" style="max-width:420px;margin:40px auto;width:100%">
  <h2 style="margin-bottom:14px">Admin sign in</h2>
  <input type="text" id="em" placeholder="Username" autocomplete="username" style="margin-bottom:10px">
  <input type="password" id="pw" placeholder="Password" autocomplete="current-password" style="width:100%;background:rgba(139,92,246,0.09);border:1px solid var(--edge);border-radius:16px;color:var(--txt);padding:12px 14px;font:inherit;outline:none">
  <div class="row"><span class="sp"></span><button class="btn pri" id="in">Sign in</button></div>
 </section>
 <div id="dash" hidden style="display:grid;gap:16px">
  <section class="glass card"><div style="display:flex;gap:30px;flex-wrap:wrap"><div><small style="color:var(--sub)">Posts</small><div class="stat"><b id="a1">0</b></div></div><div><small style="color:var(--sub)">Comments</small><div class="stat"><b id="a2">0</b></div></div><div><small style="color:var(--sub)">Likes</small><div class="stat"><b id="a3">0</b></div></div></div></section>
  <section class="glass card"><h3>Announcement banner</h3><textarea id="annin" rows="2" maxlength="300" placeholder="Shown at the top of the site, e.g. “Trailer 3 drops Friday!”"></textarea><div class="row"><span class="sp"></span><button class="btn" id="annclr">Clear</button><button class="btn pri" id="annsave">Publish</button></div></section>
  <div class="chips"><button class="chip on" data-t="posts">Posts</button><button class="chip" data-t="comments">Comments</button><button class="chip" id="rf">↻ Refresh</button></div>
  <div id="list" style="display:grid;gap:16px"></div>
 </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const SB_URL='https://dvvnvefgacwnzohucpyv.supabase.co';
const SB_KEY='sb_publishable_r7r6IKE2uMinM7iA1mr42Q_kFDZAqae';
const sb=window.supabase.createClient(SB_URL,SB_KEY);
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let tab='posts',posts=[],cmts=[],nLikes=0;
function note(m){const n=$('note');n.textContent=m;n.hidden=!m}
function show(on){$('login').hidden=on;$('dash').hidden=!on;$('dash').style.display=on?'grid':'none';$('out').hidden=!on;if(on)load()}
async function load(){
 const [p,c,l]=await Promise.all([
  sb.from('posts').select('*').order('created_at',{ascending:false}).limit(300),
  sb.from('comments').select('*').order('created_at',{ascending:false}).limit(500),
  sb.from('likes').select('id',{count:'exact',head:true})]);
 if(p.error){note('Couldn’t load: '+p.error.message);return}
 posts=p.data||[];cmts=c.data||[];nLikes=l.count||0;render();
 sb.from('settings').select('value').eq('key','announcement').maybeSingle().then(r=>{if(r.data)$('annin').value=r.data.value||''});
}
function render(){
 $('a1').textContent=posts.length;$('a2').textContent=cmts.length;$('a3').textContent=nLikes;
 document.querySelectorAll('[data-t]').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
 const when=t=>new Date(t).toLocaleString();
 if(tab==='posts'){
  $('list').innerHTML=posts.length?posts.map(p=>{
   const med=p.media?(p.mt==='video'?`<video class="media" style="max-height:200px" src="${esc(p.media)}" controls></video>`:`<img class="media" style="max-height:200px" src="${esc(p.media)}" alt="">`):'';
   return `<article class="glass post"><div class="hd"><div class="av">${esc((p.name||'F')[0]).toUpperCase()}</div><div><b>${esc(p.name)}</b><small>${when(p.created_at)}</small></div><span class="sp"></span><span class="tag">${esc(p.cat)}</span></div>${p.text?`<div class="txt">${esc(p.text)}</div>`:''}${med}<div class="row"><span class="sp"></span><button class="btn" data-dp="${esc(p.id)}">🗑 Delete post</button></div></article>`}).join(''):'<div class="glass empty">No posts.</div>';
 }else{
  $('list').innerHTML=cmts.length?cmts.map(c=>`<div class="glass post"><div class="hd"><div class="av">${esc((c.name||'F')[0]).toUpperCase()}</div><div><b>${esc(c.name)}</b><small>${when(c.created_at)}</small></div><span class="sp"></span><button class="btn" data-dc="${esc(c.id)}">🗑 Delete</button></div><div class="txt">${esc(c.body)}</div></div>`).join(''):'<div class="glass empty">No comments.</div>';
 }
}
document.addEventListener('click',async e=>{
 const t=e.target.closest('[data-t],[data-dp],[data-dc],#rf');if(!t)return;
 if(t.dataset.t){tab=t.dataset.t;render();return}
 if(t.id==='rf'){load();return}
 try{
  if(t.dataset.dp){
   if(!confirm('Delete this post, its comments, likes and file?'))return;
   const p=posts.find(x=>x.id===t.dataset.dp);
   const r=await sb.from('posts').delete().eq('id',p.id).select();
   if(r.error)throw r.error;
   if(!r.data.length)throw new Error('Not allowed — check the admin SQL policies and that you signed in with the admin email.');
   const m=(p.media||'').split('/object/public/uploads/')[1];
   if(m)await sb.storage.from('uploads').remove([decodeURIComponent(m)]);
  }else if(t.dataset.dc){
   if(!confirm('Delete this comment?'))return;
   const r=await sb.from('comments').delete().eq('id',t.dataset.dc).select();
   if(r.error)throw r.error;
   if(!r.data.length)throw new Error('Not allowed — check the admin SQL policies and that you signed in with the admin email.');
  }
  note('');await load();
 }catch(err){note('Delete failed: '+(err&&err.message||'unknown error'))}
});
$('in').onclick=async()=>{
 const r=await sb.auth.signInWithPassword({email:(v=>v.includes('@')?v:v.toLowerCase()+'@jaylunation.com')($('em').value.trim()),password:$('pw').value});
 if(r.error){note('Sign in failed: '+r.error.message);return}
 $('pw').value='';note('');show(true);
};
async function saveAnn(v){
 try{
  const r=await sb.from('settings').upsert({key:'announcement',value:v}).select();
  if(r.error)throw r.error;
  if(!r.data.length)throw new Error('Not allowed — run the settings SQL and sign in with the admin account.');
  note(v?'Announcement published.':'Announcement cleared.');if(!v)$('annin').value='';
 }catch(err){note('Couldn’t save: '+(err&&err.message||'unknown error'))}
}
$('annsave').onclick=()=>saveAnn($('annin').value.trim());
$('annclr').onclick=()=>saveAnn('');
$('pw').addEventListener('keydown',e=>{if(e.key==='Enter')$('in').click()});
$('out').onclick=async()=>{await sb.auth.signOut();posts=[];cmts=[];show(false)};
function palms(){
 const W=innerWidth,H=Math.round(innerHeight*.75),svg=$('city'),g=$('pl');
 svg.setAttribute('viewBox','0 0 '+W+' '+H);
 let s=7;const r=()=>(s=(s*16807)%2147483647)/2147483647;
 const L=[['#241640',W/30,.15,.3],['#1d1233',W/45,.25,.45],['#150b27',W/70,.4,.7],['#0e0719',W/110,.55,.95]];
 let h='';
 L.forEach(([c,n,lo,hi])=>{h+='<g fill="'+c+'">';const N=Math.ceil(n);for(let i=0;i<N;i++){const ht=H*(lo+r()*(hi-lo)),w=ht*.65,x=Math.max(0,Math.min(W-w,(i+.1+.8*r())/N*W-w/2));h+='<use href="#p" x="'+x.toFixed(0)+'" y="'+(H-ht).toFixed(0)+'" width="'+w.toFixed(0)+'" height="'+ht.toFixed(0)+'"/>'}h+='</g>'});
 g.innerHTML=h;
}
palms();addEventListener('resize',palms);
sb.auth.getSession().then(({data})=>show(!!data.session));
</script>
</body></html>
